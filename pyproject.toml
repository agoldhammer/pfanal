[project]
name = "pfanal"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Art Goldhammer", email = "art.goldhammer@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "openpyxl>=3.1.5",
]

[project.scripts]
pfanal = "pfanal:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# maturing.py lives at the repo root, outside the package.
pythonpath = ["."]
